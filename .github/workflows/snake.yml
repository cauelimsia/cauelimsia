name: snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "tools/gen_activity_cards.py"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      # Cards de linguagens e streak na identidade do cauedev.shop
      - run: python tools/gen_activity_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Paleta do cauedev.shop: ink #111111, blue #125cfe, lime #ccff00, cream #f5f2ea
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: cauelimsia
          outputs: |
            dist/snake-light.svg?color_snake=#111111&color_dots=#e9e4d8,#b9ccff,#7da2ff,#3d76fe,#125cfe
            dist/snake-dark.svg?color_snake=#ccff00&color_dots=#161b22,#0e2a66,#1746b0,#2f66e8,#7da2ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
